spring.application.name=candidat-backend
# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/candidat_db
spring.datasource.username=candidat_user
spring.datasource.password=candidat123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
cors.allowed-origins=http://localhost:8081,http://localhost:3000

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.candidat.app=DEBUG

# Changer ddl-auto à "create" pour forcer la création
spring.jpa.hibernate.ddl-auto=create

# OU pour créer et garder les données
spring.jpa.hibernate.ddl-auto=create-drop